name: Backup restore drill

# An untested backup is an assumption, not a control. This restores the most
# recent nightly dump into a throwaway PostgreSQL 18 container and checks the
# result is actually usable — so a broken backup is discovered here, on a
# Sunday, rather than during a real recovery.
#
# It also fails when the newest dump is too old, which catches the more likely
# failure: the backup job silently stopped running and nobody noticed.

on:
  schedule:
    - cron: "0 4 * * 0"  # Sundays 04:00 UTC, after Saturday night's backup
  workflow_dispatch:

env:
  # Fail if the newest dump is older than this. The backup runs daily, so
  # anything past two days means at least one run was missed.
  MAX_DUMP_AGE_HOURS: 48
  # Tables the schema is expected to contain. Restoring "successfully" into an
  # empty database would otherwise pass every other check.
  MIN_TABLE_COUNT: 21
  PGPASSWORD: drillpassword

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - name: Find and download the most recent dump
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail

          # Keys are date-stamped (unithread-YYYY-MM-DD.dump), so lexical sort
          # is chronological.
          LATEST=$(aws s3 ls "s3://unithread-backups/" --endpoint-url "$R2_ENDPOINT" \
                   | awk '{print $4}' | grep '\.dump$' | sort | tail -1)

          if [ -z "$LATEST" ]; then
            echo "::error::No dumps found in the backup bucket at all."
            exit 1
          fi
          echo "Latest dump: $LATEST"

          aws s3 cp "s3://unithread-backups/$LATEST" ./restore-test.dump \
            --endpoint-url "$R2_ENDPOINT"

          echo "DUMP_NAME=$LATEST" >> "$GITHUB_ENV"

      - name: Check the dump is recent and non-trivial
        run: |
          set -euo pipefail

          # Freshness, read from the filename rather than the object metadata so
          # a re-upload of an old dump can't disguise a stalled backup job.
          DUMP_DATE=$(echo "$DUMP_NAME" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          AGE_HOURS=$(( ( $(date -u +%s) - $(date -u -d "$DUMP_DATE" +%s) ) / 3600 ))
          echo "Dump is ${AGE_HOURS}h old (limit ${MAX_DUMP_AGE_HOURS}h)."
          if [ "$AGE_HOURS" -gt "$MAX_DUMP_AGE_HOURS" ]; then
            echo "::error::Newest backup is ${AGE_HOURS}h old — the nightly backup job is not running."
            exit 1
          fi

          # A pg_dump that fails midway can still leave a small, well-formed file.
          SIZE=$(stat -c%s ./restore-test.dump)
          echo "Dump size: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::Dump is only ${SIZE} bytes — almost certainly truncated or empty."
            exit 1
          fi

      - name: Start a throwaway PostgreSQL 18 instance
        run: |
          set -euo pipefail
          # 18 to match production: pg_restore must be at least as new as the
          # server that produced the dump.
          docker run -d --name drill-db \
            -e POSTGRES_PASSWORD="$PGPASSWORD" \
            -e POSTGRES_DB=drill \
            -p 5432:5432 \
            postgres:18

          for i in $(seq 1 30); do
            if docker exec drill-db pg_isready -U postgres -d drill >/dev/null 2>&1; then
              echo "Database ready after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Throwaway database never became ready."
          docker logs drill-db
          exit 1

      - name: Restore the dump
        run: |
          set -euo pipefail
          docker cp ./restore-test.dump drill-db:/tmp/restore.dump

          # --exit-on-error turns a partially-restored database into a failure.
          # Without it pg_restore reports errors and still exits 0, which would
          # let a half-broken backup pass the drill.
          docker exec drill-db pg_restore \
            --username=postgres --dbname=drill \
            --no-owner --no-privileges --exit-on-error \
            /tmp/restore.dump

          echo "pg_restore completed without errors."

      - name: Verify the restored database
        run: |
          set -euo pipefail
          q() { docker exec drill-db psql -U postgres -d drill -tAc "$1"; }

          TABLES=$(q "SELECT count(*) FROM information_schema.tables
                      WHERE table_schema='public' AND table_type='BASE TABLE';")
          echo "Tables restored: $TABLES (expected at least $MIN_TABLE_COUNT)"
          if [ "$TABLES" -lt "$MIN_TABLE_COUNT" ]; then
            echo "::error::Only $TABLES tables restored — the dump is incomplete."
            exit 1
          fi

          # The schema version proves this is a real UniThread database and
          # shows which migration the backup was taken at.
          VERSION=$(q "SELECT version_num FROM alembic_version;" || true)
          if [ -z "$VERSION" ]; then
            echo "::error::alembic_version is missing or empty — schema did not restore."
            exit 1
          fi
          echo "Schema at migration: $VERSION"

          # A restore that produces the schema but no rows is a silent disaster,
          # so require the one table that can never legitimately be empty.
          USERS=$(q "SELECT count(*) FROM users;")
          echo "Users restored: $USERS"
          if [ "$USERS" -lt 1 ]; then
            echo "::error::Zero users restored — data did not come through."
            exit 1
          fi

          # Referential integrity: constraints are part of what makes a backup
          # restorable into a working system, not just readable.
          FKS=$(q "SELECT count(*) FROM information_schema.table_constraints
                   WHERE constraint_type='FOREIGN KEY' AND table_schema='public';")
          echo "Foreign key constraints: $FKS"
          if [ "$FKS" -lt 1 ]; then
            echo "::error::No foreign keys restored — schema is structurally incomplete."
            exit 1
          fi

      - name: Row count report
        run: |
          docker exec drill-db psql -U postgres -d drill -c "
            SELECT relname AS table_name, n_live_tup AS approx_rows
            FROM pg_stat_user_tables
            ORDER BY n_live_tup DESC;"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backup restore drill"
            echo ""
            echo "- Dump: \`${DUMP_NAME:-unknown}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down
        if: always()
        run: |
          docker rm -f drill-db 2>/dev/null || true
          rm -f ./restore-test.dump

  # The database drill above proves the rows come back. This proves the files do
  # — a restore that returns every post with a broken image is only half a
  # recovery. Runs independently so a media problem is reported even if the
  # database drill fails.
  media-drill:
    runs-on: ubuntu-latest
    steps:
      - name: Verify every media file is in the bucket
        env:
          API_BASE: ${{ secrets.PROD_API_BASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: s3://unithread-backups
        run: |
          set -euo pipefail

          echo "==> What production currently holds"
          curl -sS --fail-with-body -H "x-admin-key: $ADMIN_KEY" \
            "$API_BASE/api/admin/media/manifest" -o manifest.json
          SERVER_COUNT=$(jq -r '.count' manifest.json)
          echo "    $SERVER_COUNT files"

          echo "==> What the bucket holds"
          # "<key> <size>" so the comparison covers content length, not just presence.
          aws s3 ls "$BUCKET/media/" --recursive --endpoint-url "$R2_ENDPOINT" \
            | awk '{print substr($4, index($4,"/")+1) " " $3}' | sort > have.txt || true
          echo "    $(wc -l < have.txt) files"

          jq -r '.files[] | "\(.kind)/\(.name) \(.size)"' manifest.json | sort > want.txt

          # Present but the wrong size is worse than absent: the add-only sync
          # will never revisit that key, so a corrupt copy would persist forever.
          cut -d' ' -f1 want.txt | sort > want_keys.txt
          cut -d' ' -f1 have.txt | sort > have_keys.txt
          comm -23 want_keys.txt have_keys.txt > absent.txt
          comm -23 want.txt have.txt | cut -d' ' -f1 | sort > wrongsize_or_absent.txt
          comm -13 absent.txt wrongsize_or_absent.txt > mismatched.txt

          ABSENT=$(wc -l < absent.txt)
          MISMATCH=$(wc -l < mismatched.txt)
          echo "==> missing from backup: $ABSENT | size mismatch: $MISMATCH"
          [ "$ABSENT" -gt 0 ] && sed 's/^/    missing: /' absent.txt | head -20
          [ "$MISMATCH" -gt 0 ] && sed 's/^/    mismatch: /' mismatched.txt | head -20

          echo "==> Spot-checking 3 backed-up files download intact"
          SAMPLED=0
          for key in $(cut -d' ' -f1 have.txt | shuf -n 3 2>/dev/null || true); do
            [ -z "$key" ] && continue
            aws s3 cp "$BUCKET/media/$key" ./probe --endpoint-url "$R2_ENDPOINT" --quiet
            want_size=$(awk -v k="$key" '$1==k {print $2}' want.txt | head -1)
            got_size=$(stat -c%s ./probe)
            if [ -n "$want_size" ] && [ "$want_size" != "$got_size" ]; then
              echo "::error::Spot check failed for $key (expected $want_size, got $got_size)"
              exit 1
            fi
            echo "    ok: $key ($got_size bytes)"
            SAMPLED=$((SAMPLED + 1))
            rm -f ./probe
          done

          {
            echo "### Media backup drill"
            echo ""
            echo "- Files in production: $SERVER_COUNT"
            echo "- Files in bucket: $(wc -l < have.txt)"
            echo "- Missing from backup: $ABSENT"
            echo "- Size mismatches: $MISMATCH"
            echo "- Spot-checked: $SAMPLED"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ABSENT" -gt 0 ] || [ "$MISMATCH" -gt 0 ]; then
            echo "::error::Media backup is incomplete — $ABSENT missing, $MISMATCH corrupt."
            exit 1
          fi
          echo "✅ Every production media file is backed up at the correct size."
